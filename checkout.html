<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout · Comic Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'comic-red': '#DC2626', 'comic-yellow': '#FBBF24',
          'comic-blue': '#1E3A8A', 'comic-dark': '#0F172A'
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50">
<div id="app-header"></div>

<section class="bg-comic-dark text-white py-8">
  <div class="max-w-7xl mx-auto px-4">
    <h1 class="font-comic text-4xl md:text-5xl">Finalizar compra</h1>
    <div class="flex items-center gap-2 mt-3 text-sm">
      <span class="text-gray-400">Carrito</span>
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      <span class="text-white font-bold">Checkout</span>
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      <span class="text-gray-400">Confirmación</span>
    </div>
  </div>
</section>

<section class="py-12">
  <div class="max-w-7xl mx-auto px-4">
    <div id="checkout-content"></div>
  </div>
</section>

<div id="app-footer"></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/helpers.js"></script>
<script src="js/components.js"></script>
<script src="js/pages/checkout.js"></script>
</body>
</html>
