<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro · Comic Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'comic-red': '#DC2626', 'comic-yellow': '#FBBF24',
          'comic-blue': '#1E3A8A', 'comic-dark': '#0F172A'
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div id="app-header"></div>

<main class="flex-1 py-12 px-4">
  <div class="max-w-2xl mx-auto">
    <div class="text-center mb-6">
      <h1 class="font-comic text-4xl md:text-5xl text-comic-dark mb-2">Crear cuenta</h1>
      <p class="text-gray-600">Únete a la comunidad comiquera</p>
    </div>

    <div class="comic-card p-8 bg-white">
      <form id="register-form" class="space-y-5">
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-1">Nombre *</label>
            <input type="text" name="firstName" required class="input-comic" placeholder="Carlos">
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">Apellidos *</label>
            <input type="text" name="lastName" required class="input-comic" placeholder="Méndez">
          </div>
        </div>

        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-1">Email *</label>
            <input type="email" name="email" required class="input-comic" placeholder="tu@email.com">
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">Teléfono</label>
            <input type="tel" name="phone" class="input-comic" placeholder="+34 600 000 000">
          </div>
        </div>

        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-1">Contraseña *</label>
            <input type="password" name="password" id="reg-password" required minlength="6" class="input-comic" placeholder="Mínimo 6 caracteres">
            <div class="mt-1 h-1.5 bg-gray-200 rounded-full overflow-hidden">
              <div id="pwd-strength-bar" class="h-full transition-all bg-gray-200" style="width:0%"></div>
            </div>
            <p id="pwd-strength-text" class="text-xs mt-1 text-gray-500"></p>
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">Confirmar contraseña *</label>
            <input type="password" name="confirmPassword" required class="input-comic" placeholder="Repite la contraseña">
          </div>
        </div>

        <div class="border-t-2 border-gray-100 pt-4">
          <p class="text-sm text-gray-600 mb-3 font-semibold">Dirección de envío (opcional)</p>
          <div class="space-y-3">
            <div>
              <label class="block text-sm font-semibold mb-1">Calle y número</label>
              <input type="text" name="street" class="input-comic" placeholder="Calle Mayor 123">
            </div>
            <div class="grid sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-sm font-semibold mb-1">Ciudad</label>
                <input type="text" name="city" class="input-comic" placeholder="Madrid">
              </div>
              <div>
                <label class="block text-sm font-semibold mb-1">Provincia</label>
                <input type="text" name="state" class="input-comic" placeholder="Madrid">
              </div>
            </div>
            <div class="grid sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-sm font-semibold mb-1">Código postal</label>
                <input type="text" name="zip" class="input-comic" placeholder="28013">
              </div>
              <div>
                <label class="block text-sm font-semibold mb-1">País</label>
                <select name="country" class="input-comic">
                  <option>España</option>
                  <option>Portugal</option>
                  <option>Francia</option>
                  <option>Italia</option>
                  <option>Alemania</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="flex items-start gap-2">
          <input type="checkbox" name="accept" required class="mt-1 accent-comic-red">
          <label class="text-sm text-gray-600">
            Acepto los <a href="terminos-condiciones.html" class="text-comic-red hover:underline">términos y condiciones</a>
            y la <a href="politicas-privacidad.html" class="text-comic-red hover:underline">política de privacidad</a> *
          </label>
        </div>

        <button type="submit" class="btn-comic btn-comic-lg w-full">
          Crear cuenta
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
        </button>
      </form>
    </div>

    <p class="text-center mt-6 text-gray-600">
      ¿Ya tienes cuenta? <a href="login.html" class="text-comic-red font-semibold hover:underline">Inicia sesión</a>
    </p>
  </div>
</main>

<div id="app-footer"></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/helpers.js"></script>
<script src="js/components.js"></script>
<script src="js/pages/auth.js"></script>
<script>AuthPages.initRegister();</script>
</body>
</html>
