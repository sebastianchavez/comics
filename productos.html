<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo · Comic Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'comic-red': '#DC2626', 'comic-yellow': '#FBBF24',
          'comic-blue': '#1E3A8A', 'comic-dark': '#0F172A'
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50">
<div id="app-header"></div>

<!-- Page header -->
<section class="bg-comic-dark text-white py-12">
  <div class="max-w-7xl mx-auto px-4">
    <nav id="breadcrumb" class="text-sm text-gray-400 mb-3"></nav>
    <h1 class="font-comic text-4xl md:text-6xl">Catálogo de productos</h1>
    <p class="text-white/70 mt-2">Explora nuestras categorías y encuentra tu próxima lectura</p>
  </div>
</section>

<section class="py-8">
  <div class="max-w-7xl mx-auto px-4">
    <div class="grid lg:grid-cols-[260px_1fr] gap-8">
      <!-- Sidebar -->
      <aside id="filters" class="space-y-4"></aside>

      <!-- Products -->
      <div>
        <div id="toolbar" class="mb-6"></div>
        <div class="flex items-center justify-between mb-4">
          <p id="products-count" class="text-sm text-gray-600 font-semibold"></p>
        </div>
        <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6"></div>
        <div id="pagination" class="mt-12"></div>
      </div>
    </div>
  </div>
</section>

<div id="app-footer"></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/helpers.js"></script>
<script src="js/components.js"></script>
<script src="js/pages/products.js"></script>
</body>
</html>
