<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Comic Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'comic-red': '#DC2626', 'comic-yellow': '#FBBF24',
          'comic-blue': '#1E3A8A', 'comic-dark': '#0F172A'
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<div id="app-header"></div>

<main class="flex-1 flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="font-comic text-4xl md:text-5xl text-comic-dark mb-2">¡Bienvenido!</h1>
      <p class="text-gray-600">Inicia sesión en tu cuenta</p>
    </div>

    <div class="comic-card p-8 bg-white">
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-1">Email</label>
          <input type="email" name="email" required class="input-comic" placeholder="tu@email.com" autocomplete="email">
        </div>
        <div>
          <div class="flex justify-between items-baseline">
            <label class="block text-sm font-semibold mb-1">Contraseña</label>
            <a href="recuperar-password.html" class="text-xs text-comic-red hover:underline">¿Olvidaste?</a>
          </div>
          <div class="relative">
            <input type="password" name="password" required id="login-password" class="input-comic pr-10" placeholder="••••••" autocomplete="current-password">
            <button type="button" onclick="AuthPages.togglePassword('login-password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-comic-red">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" name="remember" class="accent-comic-red">
          <span class="text-sm text-gray-700">Recordarme</span>
        </label>
        <button type="submit" class="btn-comic btn-comic-lg w-full">Iniciar sesión</button>
      </form>

      <div class="divider-comic my-6"></div>

      <div class="text-center">
        <button id="quick-login" class="text-xs text-gray-500 hover:text-comic-red">
          🎮 Usar cuenta demo
        </button>
        <p class="text-xs text-gray-400 mt-1">demo@comics.com / 123456</p>
      </div>
    </div>

    <p class="text-center mt-6 text-gray-600">
      ¿No tienes cuenta? <a href="registro.html" class="text-comic-red font-semibold hover:underline">Regístrate aquí</a>
    </p>
  </div>
</main>

<div id="app-footer"></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/helpers.js"></script>
<script src="js/components.js"></script>
<script src="js/pages/auth.js"></script>
<script>
  AuthPages.togglePassword = function(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
      input.type = 'text';
      btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>';
    } else {
      input.type = 'password';
      btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>';
    }
  };
  AuthPages.initLogin();
</script>
</body>
</html>
